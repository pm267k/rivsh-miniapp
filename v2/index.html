<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<body>
<div class="экран" id="экран">
  <div class="загрузка">
    <div class="пульс"><svg viewBox="0 0 24 24"><path d="M3 9h18M7 3v3m10-3v3M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg></div>
    <div class="подпись-загрузки">Собираю расписание и задания</div>
  </div>
</div>
<div class="табы" id="табы" role="tablist"></div>

<script type="application/json" id="данные"></script>

<script>
/* Ловим всё, что падает до и во время загрузки: без консоли в Telegram
   иначе видно только бесконечный экран загрузки. */
window.onerror=function(m,s,l){var э=document.getElementById("экран");
  if(э) э.innerHTML='<div style="padding:16px;font:13px/1.5 monospace;white-space:pre-wrap">'+
    "Ошибка: "+m+"\n"+(s||"").split("/").pop()+":"+l+"</div>";};
window.addEventListener("unhandledrejection",function(e){var э=document.getElementById("экран");
  if(э) э.innerHTML='<div style="padding:16px;font:13px/1.5 monospace;white-space:pre-wrap">'+
    "Запрос не прошёл: "+((e.reason&&e.reason.message)||e.reason)+"</div>";});
</script>
<script src="/rivsh-miniapp/app.js?v=0909-2215" onerror='document.getElementById("экран").innerHTML="<div style=padding:16px>Не загрузился app.js</div>"'></script>
</body>
</html>
